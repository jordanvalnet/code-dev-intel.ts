name: security-hardening

# The weekly run is what notices a new advisory against an unchanged lockfile: pull requests
# alone only see one when somebody happens to open one.
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused security tests
        run: pnpm test -- __tests__/unit/code-intel-mcp/security.test.ts

      - name: Run dependency audit
        run: pnpm audit --audit-level=moderate
