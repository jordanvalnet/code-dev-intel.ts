name: ci

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  # The package resolves native binaries (ripgrep, ast-grep) per platform and branches on
  # `process.platform` for realpath/case handling, the user cache directory, spawn shapes,
  # atomic rename and line endings. Running one runner could never have caught a mistake
  # in any of that, so the gate runs on all three.
  #
  # Node 22 is the floor `engines.node` declares (`>=22.12.0`), so its entry also builds
  # `dist/` and self-tests the COMPILED server: what a consumer on the oldest supported
  # Node actually runs, on top of the full suite against the sources.
  quality:
    name: quality (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            compiled: true
          - os: ubuntu-latest
            node: 24
            coverage: true
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pnpm version comes from `packageManager` in package.json.
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Run tests
        run: pnpm test

      - name: Build the publishable output
        if: matrix.compiled
        run: pnpm build

      # Runs the compiled server the way an installed copy runs it — no type stripping,
      # no vitest — so the oldest supported Node proves that the published artifact boots,
      # resolves its native binaries and answers a tool call.
      - name: Self-test the compiled server
        if: matrix.compiled
        run: node ./dist/code-intel-mcp/src/server.js --self-test

      # Coverage once only: every matrix entry would otherwise upload the same numbers
      # four times over.
      - name: Run coverage
        if: matrix.coverage
        run: pnpm vitest run --coverage --coverage.reporter=text --coverage.reporter=json-summary

  # Packs the tarball `npm publish` would produce, installs it into a throwaway project on
  # each OS and drives the installed CLI: this is where a `files` mistake, a missing
  # per-platform optional dependency or a Windows-only path bug in the shipped code shows
  # up, and none of it is visible from a source-tree test run.
  release-smoke:
    name: release-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm pack` runs the package's own `prepack` (`pnpm build`), so the tarball is
      # built exactly the way a publish would build it; no separate build step is needed.
      - name: Pack the release tarball
        shell: bash
        run: |
          set -euo pipefail
          rm -rf pack-output
          mkdir -p pack-output
          pnpm pack --pack-destination pack-output
          ls -l pack-output

      # The tarball path stays REPOSITORY-RELATIVE across the `shell: bash` boundary and
      # is made absolute by the script itself: on a Windows runner bash reports `pwd` as
      # `/d/a/...`, which Node cannot resolve, so computing the absolute path in the shell
      # is exactly what would break there.
      - name: Install the tarball and smoke-test the installed server
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(ls pack-output/*.tgz | head -n 1)"
          test -n "$tarball"
          node scripts/release-smoke.mjs --version="file:$tarball"

  indexer-smoke:
    runs-on: ubuntu-latest
    needs: quality
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run indexer smoke
        run: pnpm ci:indexer

  security:
    runs-on: ubuntu-latest
    needs: quality
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # A pinned OpenGrep release, checked against its sigstore signature before it runs:
      # no remote install script and no "latest". The signing certificate must name the
      # upstream release workflow; a version bump re-checks that identity in the
      # release's `.cert` file.
      - name: Install OpenGrep
        env:
          OPENGREP_VERSION: v2.0.0
          OPENGREP_SIGNER: https://github.com/opengrep/opengrep/.github/workflows/rolling-release.yml@refs/heads/main
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/opengrep"
          base="https://github.com/opengrep/opengrep/releases/download/${OPENGREP_VERSION}"
          mkdir -p "$dir"
          for file in opengrep_linux_x86 opengrep_linux_x86.sig opengrep_linux_x86.cert; do
            curl -fsSL --retry 3 -o "$dir/$file" "$base/$file"
          done
          cosign verify-blob \
            --certificate "$dir/opengrep_linux_x86.cert" \
            --signature "$dir/opengrep_linux_x86.sig" \
            --certificate-identity "$OPENGREP_SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$dir/opengrep_linux_x86"
          # Renamed only once verified: `safe-spawn` allows the command by its basename,
          # which must be `opengrep`.
          mv "$dir/opengrep_linux_x86" "$dir/opengrep"
          chmod +x "$dir/opengrep"
          "$dir/opengrep" --version
          echo "OPENGREP_BIN=$dir/opengrep" >> "$GITHUB_ENV"

      - name: Run security scan
        run: pnpm ci:security

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opengrep-sarif
          path: opengrep.sarif
          if-no-files-found: ignore
